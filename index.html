    <script>
      // Safe guard against benign Vite HMR websocket disconnect in iframe
      (function() {
        var origError = console.error;
        console.error = function() {
          var msg = arguments[0];
          if (msg && typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('ws') !== -1)) {
            return;
          }
          if (arguments[1] && typeof arguments[1] === 'object' && String(arguments[1]).indexOf('WebSocket') !== -1) {
            return;
          }
          origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          var msg = arguments[0];
          if (msg && typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            return;
          }
          origWarn.apply(console, arguments);
        };
      })();

      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('vite') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && String(e.reason).indexOf('WebSocket') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
